<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCS Mission Starter</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --panel2: #1c2330; --line: #2d3748;
    --text: #e6edf3; --dim: #8b949e; --accent: #58a6ff; --green: #3fb950;
    --amber: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text);
         font-family: "Segoe UI", system-ui, sans-serif; min-height: 100vh; }
  header { padding: 28px 32px 12px; border-bottom: 1px solid var(--line); }
  header h1 { font-size: 22px; letter-spacing: 2px; font-weight: 600; }
  header h1 span { color: var(--accent); }
  header p { color: var(--dim); margin-top: 4px; font-size: 13px; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 20px 80px; }
  .step { background: var(--panel); border: 1px solid var(--line);
          border-radius: 10px; padding: 18px 20px; margin-bottom: 16px; }
  .step h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px;
             color: var(--accent); margin-bottom: 12px; }
  .step h2 .n { display: inline-block; width: 22px; height: 22px; border-radius: 50%;
                background: var(--accent); color: #04121f; text-align: center;
                line-height: 22px; margin-right: 8px; font-size: 12px; }
  .cards { display: flex; flex-wrap: wrap; gap: 10px; }
  .card { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
          padding: 12px 16px; cursor: pointer; min-width: 150px; flex: 1;
          transition: border-color .15s; user-select: none; }
  .card:hover { border-color: var(--dim); }
  .card.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .card.dis { opacity: .3; pointer-events: none; }
  .card b { display: block; font-size: 15px; }
  .card small { color: var(--dim); font-size: 12px; }
  select, input[type=number] { background: var(--panel2); color: var(--text);
      border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px;
      font-size: 14px; width: 100%; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 160px; }
  label { display: block; font-size: 12px; color: var(--dim); margin: 10px 0 4px; }
  .blocks { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
  .block { display: flex; align-items: flex-start; gap: 10px; background: var(--panel2);
           border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .block.dis { opacity: .35; pointer-events: none; }
  .block input { margin-top: 3px; accent-color: var(--accent); }
  .block b { font-size: 13px; display: block; }
  .block small { color: var(--dim); font-size: 11px; }
  .genbar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13,17,23,.95);
            border-top: 1px solid var(--line); padding: 14px 32px; display: flex;
            align-items: center; gap: 18px; backdrop-filter: blur(6px); }
  button#gen { background: var(--green); color: #04150a; font-weight: 700;
      border: none; border-radius: 8px; padding: 12px 34px; font-size: 15px;
      cursor: pointer; letter-spacing: .5px; }
  button#gen:disabled { opacity: .5; cursor: wait; }
  #summary { color: var(--dim); font-size: 13px; flex: 1; }
  #status { font-size: 13px; color: var(--amber); }
  .pill { display: inline-block; background: var(--panel2); border: 1px solid var(--line);
          border-radius: 20px; padding: 2px 10px; font-size: 11px; color: var(--dim); margin-left: 8px; }
</style>
</head>
<body>
<header>
  <h1>DCS <span>MISSION STARTER</span></h1>
  <p>Select, don't search. We set the stage — you write the play. No waypoints, ever.
     &nbsp;·&nbsp; <a href="/api/guide" style="color:var(--accent)">Download the user guide</a></p>
</header>
<main>
  <div class="step"><h2><span class="n">1</span>Era</h2><div class="cards" id="eras"></div></div>
  <div class="step"><h2><span class="n">2</span>Map</h2><div class="cards" id="maps"></div></div>
  <div class="step"><h2><span class="n">3</span>Coalition &amp; basing</h2>
    <div class="row">
      <div><label>Your side</label><select id="coalition">
        <option value="blue">Blue</option><option value="red">Red</option></select></div>
      <div><label>Home airbase</label><select id="home"></select></div>
      <div><label>Aircraft (full DCS roster)</label><select id="aircraft"></select></div>
    </div>
    <div class="row">
      <div><label>Slots (1 = single player)</label><input type="number" id="slots" min="1" max="4" value="1"></div>
      <div><label>Start</label><select id="start"></select></div>
      <div><label>Time</label><select id="time_of_day"></select></div>
      <div><label>Weather</label><select id="weather"></select></div>
      <div><label>Density</label><select id="density"></select></div>
      <div><label>Seed</label><input type="number" id="seed" value="1"></div>
    </div>
  </div>
  <div class="step"><h2><span class="n">4</span>Building blocks</h2>
    <div class="blocks" id="blocks"></div>
  </div>
  <div class="step" id="carrierstep" style="display:none"><h2><span class="n">4b</span>Carrier deck configuration</h2>
    <div class="row">
      <div><label>Hull</label><select id="carrier_hull"></select></div>
      <div><label>Deck layout (real-world states)</label><select id="carrier_layout"></select></div>
    </div>
    <label>Aircraft on deck</label>
    <div class="blocks" id="deck_aircraft"></div>
    <label class="block" style="margin-top:10px"><input type="checkbox" id="carrier_equipment" checked><span><b>Deck equipment</b><small>Tugs, MJ-1 loaders, crash &amp; salvage gear at real stations</small></span></label>
    <div class="blocks" style="margin-top:10px">
      <label class="block"><input type="checkbox" id="carrier_cap"><span><b>Launch CAP</b><small>Air-wing 2-ship on station toward the threat axis</small></span></label>
      <label class="block"><input type="checkbox" id="carrier_aew"><span><b>Launch Hawkeye (AAW)</b><small>Air-wing E-2 AEW orbit covering the strike group</small></span></label>
    </div>
  </div>
  <div class="step"><h2><span class="n">5</span>Template pack <span class="pill">optional</span></h2>
    <div class="cards" id="templates"></div>
    <div class="row" style="margin-top:10px"><div style="max-width:280px">
      <label>Crew difficulty (for WSO/RIO templates)</label>
      <select id="crew_difficulty">
        <option value="qualified">Qualified — clean cockpit, your calls</option>
        <option value="trainee">Trainee — crew hints tell you the next call</option>
      </select>
    </div></div>
  </div>
</main>
<div class="genbar">
  <div id="summary"></div><div id="status"></div>
  <button id="share" style="background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px 20px;font-size:14px;cursor:pointer;">COPY SHARE LINK</button>
  <button id="gen">GENERATE .MIZ</button>
</div>
<script>
const S = { map:null, era:null, template:null };
const BLOCKS = [
  ["bb_dressing","Airfield dressing","Static aircraft, GSE, infrastructure on real stands", true],
  ["bb_sams","Air defenses","Complete era-correct SAM sites + SHORAD", true],
  ["bb_tanker","Tanker","Racetrack, TACAN + freq assigned", true],
  ["bb_awacs","AWACS","On station behind friendly lines", true],
  ["bb_comms","Comms card","Non-conflicting freq/TACAN plan in briefing", true],
  ["bb_briefing","Starter briefing","Situation + contents summary", true],
  ["bb_kneeboard","Nav chart kneeboard","Comms card, airfield data + theater overview pages in the jet", true],
  ["bb_carrier","Carrier strike group","CVN + escorts on BRC, TACAN 71X / ICLS 11 / Link4 (blue, coastal maps)", false],
  ["bb_ambient","Ambient air traffic","AI transports starting up and flying between friendly fields", true],
  ["bb_navpoints","Nav reference points","Named landmarks (Belted Peak, Student Gap...) on F10 map + kneeboard", true],
  ["bb_farps","Functional FARPs","Pads + fuel/ammo/command/comms so rearm-refuel works (helo eras)", false],
  ["bb_targets","Strike target packages","Depot / convoy / C2 site placed in the enemy rear with trigger zones", false],
  ["bb_range","Practice range","Bombing ring + strafe line in the friendly rear", false],
];

// --- share links: recipe <-> base64url(JSON of non-default fields) ---
const RECIPE_DEFAULTS = {map:"caucasus",era:"coldwar",coalition:"blue",aircraft:"F_16C_50",
  home_airbase:null,slots:1,start:"cold",time_of_day:"day",weather:"clear",density:"normal",
  bb_dressing:true,bb_sams:true,bb_tanker:true,bb_awacs:true,bb_comms:true,bb_briefing:true,
  bb_kneeboard:true,bb_carrier:false,bb_ambient:true,bb_navpoints:true,bb_farps:false,bb_targets:false,bb_range:false,
  carrier_hull:null,carrier_layout:"recovery",carrier_deck_aircraft:[],carrier_equipment:true,
  carrier_cap:false,carrier_aew:false,template:null,crew_difficulty:"qualified",seed:1};
function encodeRecipe(r){
  const diff = {};
  for (const [k,v] of Object.entries(r)) if (JSON.stringify(RECIPE_DEFAULTS[k])!==JSON.stringify(v)) diff[k]=v;
  return btoa(JSON.stringify(diff)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeRecipe(code){
  const b = code.replace(/-/g,'+').replace(/_/g,'/');
  return {...RECIPE_DEFAULTS, ...JSON.parse(atob(b))};
}
let OPT = null;

function el(html){ const d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }

async function init(){
  OPT = await (await fetch('/api/options')).json();
  const maps = document.getElementById('maps');
  for (const [k,v] of Object.entries(OPT.maps)){
    const c = el(`<div class="card" data-k="${k}"><b>${v.label}</b><small>${v.free?'Free terrain':'Paid terrain'}</small></div>`);
    c.onclick = ()=>{ S.map=k; sel(maps,c); refreshEraGating(); fillHome(); sum(); };
    maps.appendChild(c);
  }
  const eras = document.getElementById('eras');
  for (const [k,v] of Object.entries(OPT.eras)){
    const c = el(`<div class="card" data-k="${k}"><b>${v.label}</b><small>Hard-filters maps, aircraft, statics &amp; SAMs to the period</small></div>`);
    c.onclick = ()=>{ S.era=k; sel(eras,c);
      // era drives everything: if the current map has no preset for it, jump
      // to the first map that does
      if (!S.map || !OPT.maps[S.map].presets[k]) {
        const valid = Object.keys(OPT.maps).find(mk=>OPT.maps[mk].presets[k]);
        S.map = valid;
        sel(document.getElementById('maps'), document.querySelector(`#maps .card[data-k="${valid}"]`));
      }
      refreshEraGating(); fillHome(); sum(); };
    eras.appendChild(c);
  }
  refreshAircraft();
  for (const key of ['start','time_of_day','weather','density']){
    const s = document.getElementById(key);
    for (const v of OPT.enums[key]) s.appendChild(el(`<option>${v}</option>`));
  }
  document.getElementById('density').value='normal';
  document.getElementById('time_of_day').value='day';
  const bl = document.getElementById('blocks');
  for (const [k,t,d,on] of BLOCKS)
    bl.appendChild(el(`<label class="block"><input type="checkbox" id="${k}" ${on?'checked':''}><span><b>${t}</b><small>${d}</small></span></label>`));
  document.getElementById('bb_carrier').addEventListener('change', refreshCarrierUI);
  const tp = document.getElementById('templates');
  const none = el(`<div class="card sel" data-k=""><b>None — pure starter</b><small>You build the mission on top</small></div>`);
  none.onclick = ()=>{ S.template=null; sel(tp,none); sum(); };
  tp.appendChild(none);
  for (const [k,v] of Object.entries(OPT.templates)){
    const c = el(`<div class="card" data-k="${k}" data-eras="${v.eras.join(',')}"><b>${v.label}</b><small>Curated scripted scenario</small></div>`);
    c.onclick = ()=>{ S.template=k; sel(tp,c); sum(); };
    tp.appendChild(c);
  }
  // carrier deck configuration UI
  const cl = document.getElementById('carrier_layout');
  for (const [k,v] of Object.entries(OPT.carriers._layouts))
    cl.appendChild(el(`<option value="${k}">${v}</option>`));
  refreshCarrierUI();
  document.getElementById('carrier_hull').onchange = ()=>{ refreshDeckAircraft(); refreshAircraft(); sum(); };
  document.getElementById('coalition').onchange = ()=>{ fillHome(); sum(); };
  ['aircraft','slots','seed'].forEach(id=>document.getElementById(id).onchange=sum);
  // defaults, or prefill from a share link (?r=<code>)
  const code = new URLSearchParams(location.search).get('r');
  if (code) { try { applyRecipe(decodeRecipe(code)); } catch(e){ defaultSelection(); } }
  else { defaultSelection(); }
  sum();
}
function defaultSelection(){
  // era-first: default to Modern (broadest module ownership); the era click
  // auto-selects the first valid map
  const card = document.querySelector('#eras .card[data-k="modern"]')
            || document.querySelector('#eras .card');
  card.click();
}
function applyRecipe(r){
  document.querySelector(`#eras .card[data-k="${r.era}"]`)?.click();
  document.querySelector(`#maps .card[data-k="${r.map}"]`)?.click();
  document.getElementById('coalition').value = r.coalition; fillHome();
  if (r.home_airbase) document.getElementById('home').value = r.home_airbase;
  document.getElementById('aircraft').value = r.aircraft;
  document.getElementById('slots').value = r.slots;
  for (const k of ['start','time_of_day','weather','density']) document.getElementById(k).value = r[k];
  document.getElementById('seed').value = r.seed;
  for (const [k] of BLOCKS) document.getElementById(k).checked = !!r[k];
  const tsel = document.querySelector(`#templates .card[data-k="${r.template||''}"]`);
  if (tsel) tsel.click();
}
function sel(container, card){
  container.querySelectorAll('.card').forEach(c=>c.classList.remove('sel'));
  card.classList.add('sel');
}
function inEra(a){
  if(!S.era) return true;
  const w = OPT.eras[S.era].window, s = a.service;
  if(!w || !s) return true;                              // unknown service = allowed
  return s[0] <= w[1] && (s[1] === null || s[1] >= w[0]); // window overlap
}
function refreshAircraft(){
  const ac = document.getElementById('aircraft');
  const prev = ac.value;
  ac.innerHTML = '';
  let pool = OPT.aircraft.filter(inEra);
  // carrier home: only carrier-capable aircraft for the selected hull's deck class
  if (document.getElementById('home')?.value === 'CARRIER'){
    const hull = document.getElementById('carrier_hull')?.value || eraHull();
    const cls = OPT.carrier_capable.hull_class[hull];
    const allowed = OPT.carrier_capable.classes[cls] || [];
    pool = pool.filter(a=>allowed.includes(a.key));
  }
  for (const a of pool)
    ac.appendChild(el(`<option value="${a.key}">${a.upcoming?'⏳ ':''}${a.id}${a.kind==='helicopter'?' (helo)':''}</option>`));
  ac.value = [...ac.options].some(o=>o.value===prev) ? prev
           : (pool.some(a=>a.key==='FA_18C_hornet') ? 'FA_18C_hornet'
              : S.era==='wwii' ? (pool.some(a=>a.key==='P_51D')?'P_51D':'') : 'F_16C_50');
  if (!ac.value && ac.options.length) ac.selectedIndex = 0;
}
function refreshCarrierUI(){
  const on = document.getElementById('bb_carrier')?.checked;
  document.getElementById('carrierstep').style.display = on ? '' : 'none';
  if (!on) return;
  const hs = document.getElementById('carrier_hull');
  const prev = hs.value;
  hs.innerHTML = '';
  for (const [k,v] of Object.entries(OPT.carriers)){
    if (k === '_layouts' || (S.era && !v.eras.includes(S.era))) continue;
    hs.appendChild(el(`<option value="${k}">${v.label}${v.module?` — ${v.module}`:''}</option>`));
  }
  if ([...hs.options].some(o=>o.value===prev)) hs.value = prev;
  refreshDeckAircraft();
}
function refreshDeckAircraft(){
  const hull = OPT.carriers[document.getElementById('carrier_hull').value];
  const da = document.getElementById('deck_aircraft');
  da.innerHTML = '';
  if (!hull) return;
  for (const ref of hull.deck_aircraft){
    const key = ref.split('.').pop();
    da.appendChild(el(`<label class="block"><input type="checkbox" class="deckac" value="${key}" checked><span><b>${key.replace(/_/g,'-')}</b><small>parked on deck</small></span></label>`));
  }
}
function refreshEraGating(){
  // landlocked maps (no carrier water): disable + uncheck the carrier block
  if (S.map){
    const hasCarrier = !!OPT.maps[S.map].has_carrier;
    const cb = document.getElementById('bb_carrier');
    const blk = cb?.closest('.block');
    if (blk){
      blk.classList.toggle('dis', !hasCarrier);
      blk.querySelector('small').textContent = hasCarrier
        ? 'CVN + escorts on BRC, TACAN 71X / ICLS 11 / Link4 (blue, coastal maps)'
        : 'No carrier water on this map';
      if (!hasCarrier && cb.checked){ cb.checked = false; }
    }
  }
  refreshCarrierUI();
  // hard era gate: roster, templates, and maps all follow the period
  refreshAircraft();
  document.querySelectorAll('#templates .card[data-eras]').forEach(c=>{
    const ok = c.dataset.eras.split(',').includes(S.era);
    c.classList.toggle('dis', !ok);
    if (!ok && S.template===c.dataset.k){ S.template=null;
      document.querySelector('#templates .card[data-k=""]').classList.add('sel');
      c.classList.remove('sel'); }
  });
  // era-first UX: maps grey out under the chosen era; eras themselves never grey
  document.querySelectorAll('#maps .card').forEach(c=>{
    const ok = !!OPT.maps[c.dataset.k].presets[S.era];
    c.classList.toggle('dis', !ok);
  });
}
function eraHull(){
  // first hull valid for the current era, if any
  return Object.entries(OPT.carriers).find(([k,v])=>k!=='_layouts'&&v.eras.includes(S.era))?.[0] || null;
}
function fillHome(){
  if(!S.map||!S.era) return;
  const side = document.getElementById('coalition').value;
  const p = OPT.maps[S.map].presets[S.era];
  const list = side==='blue'? p.blue_airbases : p.red_airbases;
  const h = document.getElementById('home');
  const prev = h.value;
  h.innerHTML='';
  // the carrier is a first-class home base on coastal maps (blue, era-valid hull)
  if (side==='blue' && OPT.maps[S.map].has_carrier && eraHull())
    h.appendChild(el(`<option value="CARRIER">⚓ The carrier (start on the boat)</option>`));
  list.forEach(n=>h.appendChild(el(`<option>${n}</option>`)));
  if ([...h.options].some(o=>o.value===prev)) h.value = prev;
  h.onchange = onHomeChange;
}
function onHomeChange(){
  const isCarrier = document.getElementById('home').value === 'CARRIER';
  const cb = document.getElementById('bb_carrier');
  if (isCarrier && !cb.checked){ cb.checked = true; refreshCarrierUI(); }
  refreshAircraft();
  sum();
}
function recipe(){
  const r = {
    map:S.map, era:S.era, template:S.template,
    crew_difficulty:document.getElementById('crew_difficulty').value,
    coalition:document.getElementById('coalition').value,
    aircraft:document.getElementById('aircraft').value,
    home_airbase:document.getElementById('home').value,
    slots:+document.getElementById('slots').value,
    start:document.getElementById('start').value,
    time_of_day:document.getElementById('time_of_day').value,
    weather:document.getElementById('weather').value,
    density:document.getElementById('density').value,
    seed:+document.getElementById('seed').value,
  };
  for (const [k] of BLOCKS) r[k]=document.getElementById(k).checked;
  if (r.bb_carrier){
    r.carrier_hull = document.getElementById('carrier_hull').value || null;
    r.carrier_layout = document.getElementById('carrier_layout').value;
    r.carrier_deck_aircraft = [...document.querySelectorAll('.deckac:checked')].map(c=>c.value);
    r.carrier_equipment = document.getElementById('carrier_equipment').checked;
    r.carrier_cap = document.getElementById('carrier_cap').checked;
    r.carrier_aew = document.getElementById('carrier_aew').checked;
  }
  return r;
}
function sum(){
  if(!OPT||!S.map||!S.era) return;
  const r = recipe();
  document.getElementById('summary').textContent =
    `${OPT.maps[S.map].label} · ${OPT.eras[S.era].label} · ${r.coalition} · ${r.aircraft} from ${r.home_airbase}` +
    (S.template? ` · ${S.template}` : '') + ` · seed ${r.seed}`;
}
document.getElementById('gen').onclick = async ()=>{
  const btn = document.getElementById('gen'), st = document.getElementById('status');
  btn.disabled = true; st.textContent = 'Generating…';
  try{
    const res = await fetch('/api/generate', {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({recipe: recipe()})});
    if(!res.ok){ st.textContent = 'Error: ' + (await res.json()).detail; return; }
    const warn = res.headers.get('X-Warnings');
    const blob = await res.blob();
    const cd = res.headers.get('Content-Disposition')||'';
    const fname = (cd.match(/filename="?([^";]+)/)||[])[1] || 'starter.miz';
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = fname; a.click();
    st.textContent = warn ? ('Done, with warnings: '+warn) : 'Done — check your downloads.';
  } catch(e){ st.textContent = 'Error: '+e; }
  finally { btn.disabled = false; }
};
document.getElementById('share').onclick = async ()=>{
  const code = encodeRecipe(recipe());
  const url = `${location.origin}/?r=${code}`;
  await navigator.clipboard.writeText(url);
  document.getElementById('status').textContent = 'Share link copied — anyone can regenerate this exact starter.';
};
init();
</script>
</body>
</html>
