name: Deploy to Fly.io

# Auto-deploy on every push to main. Requires a repo secret FLY_API_TOKEN
# (create it with:  fly tokens create deploy -x 8760h  → add under
# GitHub repo → Settings → Secrets and variables → Actions).

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group        # never run two deploys at once
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
